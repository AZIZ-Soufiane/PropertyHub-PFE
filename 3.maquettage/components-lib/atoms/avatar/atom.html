<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-start justify-center p-12">
    <div class="flex flex-wrap items-center gap-8">
        <!-- XS -->
        <div class="text-center space-y-2">
            <img class="inline-block size-8 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">XS</p>
        </div>
        <!-- SM -->
        <div class="text-center space-y-2">
            <img class="inline-block size-10 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">SM</p>
        </div>
        <!-- MD -->
        <div class="text-center space-y-2">
            <img class="inline-block size-14 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">MD</p>
        </div>
        <!-- LG -->
        <div class="text-center space-y-2">
            <img class="inline-block size-20 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">LG</p>
        </div>
        <!-- Initials -->
        <div class="text-center space-y-2">
            <span
                class="inline-flex items-center justify-center size-14 rounded-full bg-blue-600 text-white text-xl font-bold shadow">MJ</span>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Initials</p>
        </div>
    </div>
</body>

</html>
