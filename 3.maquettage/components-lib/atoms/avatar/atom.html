<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 100: '#dbe4f4', 200: '#bdcfea', 300: '#90addc', 400: '#5d85c8', 500: '#3b65ad', 600: '#2d4f8e', 700: '#264073', 800: '#23385f', 900: '#213151', 950: '#161e33' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-start justify-center p-12">
    <div class="flex flex-wrap items-center gap-8">
        <!-- XS -->
        <div class="text-center space-y-2">
            <img class="inline-block size-8 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar" width="32" height="32">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">XS</p>
        </div>
        <!-- SM -->
        <div class="text-center space-y-2">
            <img class="inline-block size-10 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar" width="40" height="40">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">SM</p>
        </div>
        <!-- MD -->
        <div class="text-center space-y-2">
            <img class="inline-block size-14 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar" width="56" height="56">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">MD</p>
        </div>
        <!-- LG -->
        <div class="text-center space-y-2">
            <img class="inline-block size-20 rounded-full ring-2 ring-white shadow"
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                alt="Avatar" width="80" height="80">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">LG</p>
        </div>
        <!-- Initials -->
        <div class="text-center space-y-2">
            <span
                class="inline-flex items-center justify-center size-14 rounded-full text-white text-xl font-bold shadow"
                style="background:#3b65ad;">MJ</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Initials</p>
        </div>
    </div>
</body>

</html>
