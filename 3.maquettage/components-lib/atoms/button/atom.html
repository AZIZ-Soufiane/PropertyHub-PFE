<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 100: '#dbe4f4', 200: '#bdcfea', 300: '#90addc', 400: '#5d85c8', 500: '#3b65ad', 600: '#2d4f8e', 700: '#264073', 800: '#23385f', 900: '#213151', 950: '#161e33' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-4 sm:p-6 md:p-8 flex flex-wrap gap-2 sm:gap-3 md:gap-4 items-center bg-slate-50 min-h-screen">
    <!-- Primary Button (Preline Style) -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200 shadow-md hover:shadow-lg hover:-translate-y-0.5">
        Primary Action
    </button>

    <!-- Secondary Button -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200">
        Secondary Action
    </button>

    <!-- Ghost Button -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-transparent text-primary-600 hover:bg-primary-50 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200">
        Ghost Action
    </button>

    <!-- Outline Button -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border-2 border-primary-600 bg-transparent text-primary-600 hover:bg-primary-600 hover:text-white disabled:opacity-50 disabled:pointer-events-none transition-all duration-200\">
        Outline Action
    </button>

    <!-- Danger Button -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-rose-500 text-white hover:bg-rose-600 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200 shadow-md hover:shadow-lg\">
        Danger Action
    </button>

    <!-- Success Button -->
    <button type="button"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-emerald-500 text-white hover:bg-emerald-600 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200\">
        Success Action
    </button>

    <!-- Disabled -->
    <button type="button" disabled
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-slate-100 text-slate-400 disabled:opacity-50 disabled:pointer-events-none cursor-not-allowed">
        Disabled
    </button>

    <!-- Small Button -->
    <button type="button"
        class="py-2 px-4 inline-flex items-center gap-x-2 text-xs font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200">
        Small Button
    </button>

    <!-- Large Button -->
    <button type="button"
        class="py-4 px-8 inline-flex items-center gap-x-2 text-base font-bold rounded-2xl border border-transparent bg-secondary-500 text-white hover:bg-secondary-600 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200 shadow-lg hover:shadow-xl">
        Large Button
    </button>
</body>

</html>
