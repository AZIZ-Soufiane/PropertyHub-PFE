<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Select – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-start justify-center p-12">
    <div class="w-full max-w-sm space-y-6">
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Default Select</p>
            <select
                class="py-3 px-4 block w-full border border-gray-200 rounded-xl text-sm transition focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none bg-white">
                <option>All Types</option>
                <option>Modern Villa</option>
                <option>Penthouse</option>
                <option>Beach House</option>
            </select>
        </div>
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Disabled</p>
            <select disabled
                class="py-3 px-4 block w-full border border-gray-100 bg-gray-50 text-gray-400 rounded-xl text-sm cursor-not-allowed">
                <option>Disabled</option>
            </select>
        </div>
    </div>
</body>

</html>
