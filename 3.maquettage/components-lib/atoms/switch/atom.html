<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-start justify-center p-12">
    <div class="w-full max-w-xs space-y-6">
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Off</p>
            <div class="flex items-center gap-x-3">
                <input type="checkbox" id="sw-off"
                    class="relative w-[3.25rem] h-7 p-px bg-gray-100 border-transparent text-transparent rounded-full cursor-pointer transition-colors ease-in-out duration-200 focus:ring-blue-600 checked:bg-none checked:text-blue-600 checked:border-blue-600 before:inline-block before:size-6 before:bg-white checked:before:bg-blue-200 before:translate-x-0 checked:before:translate-x-full before:rounded-full before:shadow before:transform before:ring-0 before:transition before:ease-in-out before:duration-200">
                <label for="sw-off" class="text-sm font-semibold text-gray-700">Notifications</label>
            </div>
        </div>
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">On</p>
            <div class="flex items-center gap-x-3">
                <input type="checkbox" id="sw-on" checked
                    class="relative w-[3.25rem] h-7 p-px bg-gray-100 border-transparent text-transparent rounded-full cursor-pointer transition-colors ease-in-out duration-200 focus:ring-blue-600 checked:bg-none checked:text-blue-600 checked:border-blue-600 before:inline-block before:size-6 before:bg-white checked:before:bg-blue-200 before:translate-x-0 checked:before:translate-x-full before:rounded-full before:shadow before:transform before:ring-0 before:transition before:ease-in-out before:duration-200">
                <label for="sw-on" class="text-sm font-semibold text-gray-700">Dark Mode</label>
            </div>
        </div>
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Disabled</p>
            <div class="flex items-center gap-x-3">
                <input type="checkbox" id="sw-disabled" disabled
                    class="relative w-[3.25rem] h-7 p-px bg-gray-100 border-transparent text-transparent rounded-full cursor-not-allowed opacity-50 transition-colors ease-in-out duration-200 before:inline-block before:size-6 before:bg-white before:rounded-full before:shadow before:transform before:transition before:ease-in-out before:duration-200">
                <label for="sw-disabled" class="text-sm font-semibold text-gray-400">Disabled</label>
            </div>
        </div>
    </div>
</body>

</html>
