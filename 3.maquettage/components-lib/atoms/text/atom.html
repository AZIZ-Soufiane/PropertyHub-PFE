<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-8 space-y-6 bg-slate-50 max-w-2xl">
    <!-- Variant: Lead -->
    <p class="text-xl text-slate-600 leading-relaxed font-medium">
        Lead paragraph for highlighting key value propositions or introductions.
    </p>

    <!-- Variant: Normal -->
    <p class="text-base text-slate-600 leading-relaxed">
        Standard body text for descriptions and general information about the properties.
    </p>

    <!-- Variant: Small -->
    <p class="text-sm text-slate-500">
        Small text for captions, footer links, or secondary information.
    </p>
</body>

</html>
