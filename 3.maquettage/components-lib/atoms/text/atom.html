<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-8 space-y-6 bg-slate-50 max-w-2xl">
    <!-- Variant: Lead -->
    <p class="text-xl text-slate-600 leading-relaxed font-medium">
        Lead paragraph for highlighting key value propositions or introductions.
    </p>

    <!-- Variant: Normal -->
    <p class="text-base text-slate-600 leading-relaxed">
        Standard body text for descriptions and general information about the properties.
    </p>

    <!-- Variant: Small -->
    <p class="text-sm text-slate-500">
        Small text for captions, footer links, or secondary information.
    </p>
</body>

</html>
