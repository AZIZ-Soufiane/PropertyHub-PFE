<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title – Atom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="p-8 space-y-6 bg-slate-50">
    <!-- Variant: H1 -->
    <h1 class="text-4xl md:text-5xl font-bold text-slate-900 tracking-tight">
        Level 1 Heading
    </h1>

    <!-- Variant: H2 -->
    <h2 class="text-3xl font-bold text-slate-800 tracking-tight">
        Level 2 Heading
    </h2>

    <!-- Variant: H3 -->
    <h3 class="text-xl font-semibold text-slate-800">
        Level 3 Heading
    </h3>
</body>

</html>
