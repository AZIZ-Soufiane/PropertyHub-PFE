<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sidebar – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 100: '#dbe4f4', 500: '#3b65ad', 600: '#2d4f8e' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col sm:flex-row">
    <div class="w-full sm:w-64 bg-white border-b sm:border-b-0 sm:border-r border-slate-200 pt-4 sm:pt-7 pb-4 sm:pb-10 min-h-screen flex flex-col">
        <!-- Logo -->
        <div class="px-4 sm:px-6 mb-6 sm:mb-8">
            <a class="text-xl sm:text-2xl font-black tracking-tighter" href="#" aria-label="PropertyHub"
                style="color:#3b65ad;">PropertyHub</a>
            <p class="text-[9px] sm:text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Admin Portal</p>
        </div>
        <!-- Nav -->
        <nav class="px-4 sm:px-6 flex-1" aria-label="Sidebar navigation">
            <ul class="space-y-1.5">
                <li>
                    <a class="flex items-center gap-x-3 py-2.5 px-3 text-sm font-semibold rounded-lg bg-primary-50 text-primary-700 border border-primary-100 transition-all" href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                            <line x1="3" x2="21" y1="9" y2="9" />
                            <line x1="9" x2="9" y1="21" y2="9" />
                        </svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-slate-600 font-medium rounded-xl hover:bg-slate-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Properties
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-slate-600 font-medium rounded-xl hover:bg-slate-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        Users &amp; Roles
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-slate-600 font-medium rounded-xl hover:bg-slate-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
                        </svg>
                        System Logs
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-slate-600 font-medium rounded-xl hover:bg-slate-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        Messages
                        <span
                            class="ms-auto size-5 inline-flex justify-center items-center rounded-full text-[10px] font-bold text-white"
                            style="background:#3b65ad;">3</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- Bottom profile -->
        <div class="px-4 sm:px-6 mt-auto pt-4 sm:pt-6 border-t border-slate-100">
            <div class="flex items-center gap-3">
                <img class="size-9 rounded-full"
                    src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&w=300&q=80"
                    alt="Admin" width="36" height="36">
                <div>
                    <p class="text-sm font-bold text-slate-800">Admin User</p>
                    <p class="text-[10px] text-slate-400 font-semibold">admin@propertyhub.com</p>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-1 flex items-center justify-center text-slate-400 font-bold text-xs sm:text-sm px-4 sm:px-0">← Sidebar preview</div>
</body>

</html>
