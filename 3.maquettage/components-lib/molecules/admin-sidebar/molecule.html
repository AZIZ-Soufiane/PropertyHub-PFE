<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sidebar – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex">
    <div class="w-64 bg-white border-r border-gray-200 pt-7 pb-10 min-h-screen">
        <div class="px-6 mb-8">
            <a class="text-2xl font-extrabold text-blue-600" href="#" aria-label="Brand">PropertyHub</a>
        </div>
        <nav class="px-6 w-full">
            <ul class="space-y-1.5">
                <li>
                    <a class="flex items-center gap-x-3.5 py-2.5 px-3 bg-blue-50 text-sm text-blue-600 font-semibold rounded-xl"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                            <line x1="3" x2="21" y1="9" y2="9" />
                            <line x1="9" x2="9" y1="21" y2="9" />
                        </svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-gray-700 font-medium rounded-xl hover:bg-gray-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Properties
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-gray-700 font-medium rounded-xl hover:bg-gray-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        Users & Roles
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-gray-700 font-medium rounded-xl hover:bg-gray-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
                        </svg>
                        System Logs
                    </a>
                </li>
                <li>
                    <a class="w-full flex items-center gap-x-3.5 py-2.5 px-3 text-sm text-gray-700 font-medium rounded-xl hover:bg-gray-100 transition-all"
                        href="#">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        Messages
                        <span
                            class="ms-auto size-5 inline-flex justify-center items-center rounded-full text-[10px] font-bold bg-blue-600 text-white">3</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="flex-1 flex items-center justify-center text-gray-400 font-bold text-sm">
        ← Sidebar preview
    </div>
</body>

</html>
