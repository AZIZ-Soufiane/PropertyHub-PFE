<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Card – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-start justify-center p-12">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 max-w-2xl w-full">

        <!-- Card 1 -->
        <div
            class="flex flex-col bg-white border border-gray-100 shadow-sm rounded-3xl overflow-hidden transition-all hover:shadow-xl">
            <div class="relative h-52 overflow-hidden">
                <img class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                    src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&w=600&q=80"
                    alt="Property">
                <span
                    class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-gray-800 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest shadow-sm">For
                    Sale</span>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-black text-gray-800 mb-0.5">Sunset Villa</h3>
                <p class="text-2xl font-black text-blue-600 mb-6">$1,250,000</p>
                <div class="space-y-2.5">
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">🛏 Bedrooms</span>
                        <span class="font-black text-gray-800">4</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">🚿 Bathrooms</span>
                        <span class="font-black text-gray-800">3</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">📐 Sq Ft</span>
                        <span class="font-black text-gray-800">3,200</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-semibold">🏊 Pool</span>
                        <span class="font-black text-emerald-600">Yes</span>
                    </div>
                </div>
                <button
                    class="mt-8 w-full py-3 text-sm font-bold rounded-2xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all duration-300">
                    Remove from Comparison
                </button>
            </div>
        </div>

        <!-- Card 2 -->
        <div
            class="flex flex-col bg-white border border-gray-100 shadow-sm rounded-3xl overflow-hidden transition-all hover:shadow-xl">
            <div class="relative h-52 overflow-hidden">
                <img class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                    src="https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=600&q=80"
                    alt="Property">
                <span
                    class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-gray-800 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest shadow-sm">For
                    Sale</span>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-black text-gray-800 mb-0.5">The Glass House</h3>
                <p class="text-2xl font-black text-blue-600 mb-6">$850,000</p>
                <div class="space-y-2.5">
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">🛏 Bedrooms</span>
                        <span class="font-black text-gray-800">3</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">🚿 Bathrooms</span>
                        <span class="font-black text-gray-800">2</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                        <span class="text-gray-400 font-semibold">📐 Sq Ft</span>
                        <span class="font-black text-gray-800">2,750</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-semibold">🏊 Pool</span>
                        <span class="font-black text-rose-500">No</span>
                    </div>
                </div>
                <button
                    class="mt-8 w-full py-3 text-sm font-bold rounded-2xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all duration-300">
                    Remove from Comparison
                </button>
            </div>
        </div>

    </div>
</body>

</html>
