<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Card – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 100: '#dbe4f4', 500: '#3b65ad', 600: '#2d4f8e' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-start justify-center p-4 sm:p-6 md:p-12 py-6 sm:py-8 md:py-12">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 max-w-2xl w-full mx-auto">

        <!-- Card 1 -->
        <div
            class="flex flex-col bg-white border border-slate-100 shadow-sm rounded-3xl overflow-hidden transition-all hover:shadow-xl">
            <div class="relative h-52 overflow-hidden">
                <img class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                    src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&w=600&q=80"
                    alt="Sunset Villa" width="600" height="208">
                <span
                    class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest shadow-sm">For
                    Sale</span>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-black text-slate-800 mb-0.5">Sunset Villa</h3>
                <p class="text-2xl font-black mb-6" style="color:#3b65ad;">$1,250,000</p>
                <div class="space-y-2.5">
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">🛏 Bedrooms</span>
                        <span class="font-black text-slate-800">4</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">🚿 Bathrooms</span>
                        <span class="font-black text-slate-800">3</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">📐 Sq Ft</span>
                        <span class="font-black text-slate-800">3,200</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400 font-semibold">🏊 Pool</span>
                        <span class="font-black text-emerald-600">Yes</span>
                    </div>
                </div>
                <button type="button"
                    class="mt-8 w-full py-3 text-sm font-bold rounded-2xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all duration-300">
                    Remove from Comparison
                </button>
            </div>
        </div>

        <!-- Card 2 -->
        <div
            class="flex flex-col bg-white border border-slate-100 shadow-sm rounded-3xl overflow-hidden transition-all hover:shadow-xl">
            <div class="relative h-52 overflow-hidden">
                <img class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                    src="https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=600&q=80"
                    alt="The Glass House" width="600" height="208">
                <span
                    class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest shadow-sm">For
                    Sale</span>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-black text-slate-800 mb-0.5">The Glass House</h3>
                <p class="text-2xl font-black mb-6" style="color:#3b65ad;">$850,000</p>
                <div class="space-y-2.5">
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">🛏 Bedrooms</span>
                        <span class="font-black text-slate-800">3</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">🚿 Bathrooms</span>
                        <span class="font-black text-slate-800">2</span>
                    </div>
                    <div class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="text-slate-400 font-semibold">📐 Sq Ft</span>
                        <span class="font-black text-slate-800">2,750</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400 font-semibold">🏊 Pool</span>
                        <span class="font-black text-rose-500">No</span>
                    </div>
                </div>
                <button type="button"
                    class="mt-8 w-full py-3 text-sm font-bold rounded-2xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all duration-300">
                    Remove from Comparison
                </button>
            </div>
        </div>

    </div>
</body>

</html>
