<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#3b65ad', 600: '#2d4f8e' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-400 py-8 sm:py-12 md:py-16">
    <footer class="bg-slate-950 py-12 sm:py-20 md:py-32 px-4 rounded-t-3xl sm:rounded-t-[3rem] md:rounded-t-[5rem]">
        <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 sm:gap-12 md:gap-20">
            <div class="md:col-span-1">
                <a class="text-2xl sm:text-3xl font-black text-white mb-4 sm:mb-8 block tracking-tighter"
                    href="home.html">Property<span class="text-blue-500">Hub.</span></a>
                <p class="text-gray-500 font-medium leading-[1.8] text-sm">Elevating the real estate experience through
                    intelligent management and stunning presentation.</p>
            </div>
            <div>
                <h4 class="text-gray-400 font-black mb-4 sm:mb-8 text-[8px] sm:text-[10px] uppercase tracking-[0.2em]">
                    Quick Access</h4>
                <ul class="space-y-3 sm:space-y-4 text-white font-bold text-xs sm:text-sm">
                    <li><a class="hover:text-blue-500 transition-colors" href="properties.html">Listing</a></li>
                    <li><a class="hover:text-blue-500 transition-colors" href="compare.html">Comparison</a></li>
                    <li><a class="hover:text-blue-500 transition-colors" href="login.html">Authentication</a></li>
                </ul>
            </div>
            <div class="sm:col-span-1 md:col-span-2">
                <h4 class="text-gray-400 font-black mb-4 sm:mb-8 text-[8px] sm:text-[10px] uppercase tracking-[0.2em]">
                    Newsletter</h4>
                <form class="flex flex-col sm:flex-row gap-2">
                    <input type="email" placeholder="Email contact"
                        class="grow bg-white/5 border border-white/10 rounded-lg sm:rounded-2xl px-4 sm:px-6 py-3 sm:py-4 outline-none focus:border-blue-500 text-white font-bold transition-all text-sm">
                    <button
                        class="px-6 sm:px-8 py-3 sm:py-4 bg-white text-black font-black text-sm rounded-lg sm:rounded-2xl hover:bg-gray-100 transition-all whitespace-nowrap">Join</button>
                </form>
            </div>
        </div>
        <div
            class="max-w-7xl mx-auto border-t border-white/5 mt-12 sm:mt-20 md:mt-24 pt-6 sm:pt-10 flex flex-col sm:flex-row justify-between gap-4 sm:gap-6 text-[7px] sm:text-[10px] font-black text-gray-700 tracking-[0.2em] sm:tracking-[0.3em] uppercase">
            <span>© 2026 PropertyHub Luxury Estate.</span>
            <span>Crafted by Solicode.</span>
        </div>
    </footer>
</body>

</html>
