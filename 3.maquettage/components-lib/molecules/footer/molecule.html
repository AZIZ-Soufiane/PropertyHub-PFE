<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-400 py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-2xl font-bold text-white mb-6">PropertyHub</h2>
                <p class="text-sm leading-relaxed">Professional, real-time real estate management platform designed to
                    connect agency owners, agents, and buyers seamlessly.</p>
            </div>
            <div>
                <h3 class="text-white font-bold mb-6">Stay Updated</h3>
                <div class="relative">
                    <input type="email" placeholder="email@address.com"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-secondary-500 transition-colors">
                    <button
                        class="absolute right-1 top-1 bottom-1 px-4 bg-secondary-500 text-white font-bold rounded-lg transition-colors">Join</button>
                </div>
            </div>
        </div>
        <div class="mt-16 pt-8 border-t border-white/5 text-[10px] font-bold tracking-widest uppercase text-center">
            © 2026 PropertyHub. All rights reserved.
        </div>
    </div>
</body>

</html>
