<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 100: '#dbe4f4', 500: '#3b65ad', 600: '#2d4f8e', 700: '#264073' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen">
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="#" class="text-2xl font-bold text-primary-600 tracking-tight">PropertyHub</a>
                </div>

                <!-- Desktop nav links -->
                <div class="hidden md:ml-6 md:flex md:space-x-8">
                    <a href="#"
                        class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-primary-600 border-b-2 border-primary-500">Home</a>
                    <a href="#"
                        class="inline-flex items-center px-1 pt-1 text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Properties</a>
                    <a href="#"
                        class="inline-flex items-center px-1 pt-1 text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Compare</a>

                    <!-- Preline Dropdown — Dashboard -->
                    <div class="hs-dropdown relative inline-flex items-center">
                        <button id="nav-dashboard-dropdown" type="button"
                            class="hs-dropdown-toggle inline-flex items-center gap-1 px-1 pt-1 text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">
                            Dashboard
                            <svg class="size-3.5 hs-dropdown-open:rotate-180 transition-transform" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                        <div class="hs-dropdown-menu transition-[opacity,margin] hs-dropdown-open:opacity-100 opacity-0 hidden w-48 bg-white shadow-xl rounded-2xl border border-slate-100 p-1 mt-2 z-50"
                            aria-labelledby="nav-dashboard-dropdown">
                            <a href="#"
                                class="flex items-center gap-x-3 py-2 px-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                                Agent Dashboard
                            </a>
                            <a href="#"
                                class="flex items-center gap-x-3 py-2 px-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                                Admin Panel
                            </a>
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="flex items-center gap-3">
                    <button type="button"
                        class="px-5 py-2.5 bg-primary-600 text-white font-semibold rounded-xl hover:bg-primary-700 transition-all shadow-sm">
                        Login
                    </button>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>
