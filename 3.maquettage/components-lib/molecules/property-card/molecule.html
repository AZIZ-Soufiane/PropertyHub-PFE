<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff3fa',
                            100: '#dbe4f4',
                            200: '#bdcfea',
                            300: '#90addc',
                            400: '#5d85c8',
                            500: '#3b65ad',
                            600: '#2d4f8e',
                            700: '#264073',
                            800: '#23385f',
                            900: '#213151',
                            950: '#161e33',
                        },
                        secondary: {
                            500: '#029fca',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="p-12 bg-slate-50 min-h-screen flex items-center justify-center">
    <article
        class="group bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-500 overflow-hidden flex flex-col h-full max-w-sm">
        <div class="relative h-64 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1600585154340-be6199f7d009?auto=format&fit=crop&w=800&q=80"
                alt="Villa"
                class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
            <div class="absolute top-4 left-4">
                <span
                    class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500 text-white shadow-lg">For
                    Sale</span>
            </div>
        </div>
        <div class="p-6 flex-grow">
            <div class="flex justify-between items-start mb-2">
                <h3 class="text-xl font-bold text-slate-900 group-hover:text-primary-600 transition-colors">Modern
                    Luxury Villa</h3>
                <span class="text-lg font-bold text-primary-600">$450k</span>
            </div>
            <p class="text-sm text-slate-500 mb-4">Downtown Austin, TX</p>
            <div class="flex items-center justify-between py-4 border-t border-slate-50">
                <div class="flex items-center space-x-4">
                    <span class="text-xs font-semibold text-slate-600">3 Beds</span>
                    <span class="text-xs font-semibold text-slate-600">2 Baths</span>
                </div>
            </div>
        </div>
        <div class="px-6 pb-6">
            <button
                class="w-full py-3 bg-slate-50 text-slate-700 font-bold rounded-2xl group-hover:bg-primary-600 group-hover:text-white transition-all duration-300">
                View Details
            </button>
        </div>
    </article>
</body>

</html>
