<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Card – Molecule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff3fa', 500: '#3b65ad', 600: '#2d4f8e' },
                        secondary: { 500: '#029fca' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-start justify-center p-4 sm:p-6 md:p-12 py-6 sm:py-8 md:py-12">

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-5xl mx-auto">
        <!-- Total Users -->
        <div class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-2xl p-5 hover:shadow-md transition-all">
            <div class="flex items-center gap-x-4 mb-3">
                <div class="size-11 flex justify-center items-center rounded-xl flex-shrink-0" style="background:#eff3fa; color:#3b65ad;">
                    <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </div>
                <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Total Users</p>
            </div>
            <h3 class="text-3xl font-black text-slate-800">72,540</h3>
            <span class="flex items-center gap-x-1 text-emerald-600 font-bold text-sm mt-2">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                    <polyline points="16 7 22 7 22 13" />
                </svg>
                +1.7% this month
            </span>
        </div>

        <!-- Properties -->
        <div class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-2xl p-5 hover:shadow-md transition-all">
            <div class="flex items-center gap-x-4 mb-3">
                <div class="size-11 flex justify-center items-center bg-amber-50 text-amber-600 rounded-xl flex-shrink-0">
                    <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                </div>
                <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Properties</p>
            </div>
            <h3 class="text-3xl font-black text-slate-800">1,340</h3>
            <span class="flex items-center gap-x-1 text-emerald-600 font-bold text-sm mt-2">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                    <polyline points="16 7 22 7 22 13" />
                </svg>
                +5.2% growth
            </span>
        </div>

        <!-- Appointments -->
        <div class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-2xl p-5 hover:shadow-md transition-all">
            <div class="flex items-center gap-x-4 mb-3">
                <div class="size-11 flex justify-center items-center bg-purple-50 text-purple-600 rounded-xl flex-shrink-0">
                    <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                        <line x1="16" x2="16" y1="2" y2="6" />
                        <line x1="8" x2="8" y1="2" y2="6" />
                        <line x1="3" x2="21" y1="10" y2="10" />
                    </svg>
                </div>
                <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Appointments</p>
            </div>
            <h3 class="text-3xl font-black text-slate-800">4,520</h3>
            <span class="flex items-center gap-x-1 font-bold text-sm mt-2" style="color:#029fca;">
                — Steady performance
            </span>
        </div>

        <!-- Revenue -->
        <div class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-2xl p-5 hover:shadow-md transition-all">
            <div class="flex items-center gap-x-4 mb-3">
                <div class="size-11 flex justify-center items-center bg-emerald-50 text-emerald-600 rounded-xl flex-shrink-0">
                    <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                    </svg>
                </div>
                <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Revenue</p>
            </div>
            <h3 class="text-3xl font-black text-slate-800">$542K</h3>
            <span class="flex items-center gap-x-1 text-rose-500 font-bold text-sm mt-2">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
                    <polyline points="16 17 22 17 22 11" />
                </svg>
                -0.4% this month
            </span>
        </div>
    </div>
</body>

</html>
