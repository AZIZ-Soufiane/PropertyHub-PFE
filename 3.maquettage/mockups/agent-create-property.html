<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Property Listing - PropertyHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-slate-900 flex text-gray-800 dark:text-gray-200">

    <div class="w-full">
        <header
            class="sticky top-0 inset-x-0 flex flex-wrap sm:justify-start sm:flex-nowrap z-[48] w-full bg-white border-b text-sm py-2.5 sm:py-4 dark:bg-gray-800 dark:border-gray-700">
            <nav class="flex basis-full items-center w-full mx-auto px-4 sm:px-6" aria-label="Global">
                <div class="me-5 lg:me-0 text-xl font-semibold dark:text-white">Create New Listing</div>
                <div class="w-full flex items-center justify-end sm:justify-between sm:gap-x-3 sm:order-3">
                    <div class="hidden sm:block"></div>
                    <a class="text-blue-600 font-medium" href="agent-dashboard.html">Cancel</a>
                </div>
            </nav>
        </header>

        <div class="max-w-4xl px-4 py-8 sm:px-6 lg:px-8 mx-auto">
            <div class="bg-white border rounded-xl shadow-sm dark:bg-slate-900 dark:border-gray-700">
                <form class="p-6 md:p-8 space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
                        <!-- Property Title -->
                        <div class="sm:col-span-2">
                            <label for="title" class="block mb-2 text-sm font-medium dark:text-white">Property
                                Title</label>
                            <input type="text" id="title"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="e.g. Beautiful Sunset Villa in Malibu">
                        </div>

                        <!-- Price -->
                        <div>
                            <label for="price" class="block mb-2 text-sm font-medium dark:text-white">Price ($)</label>
                            <input type="number" id="price"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="1250000">
                        </div>

                        <!-- Location -->
                        <div>
                            <label for="location" class="block mb-2 text-sm font-medium dark:text-white">Location /
                                Address</label>
                            <input type="text" id="location"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="e.g. Malibu, CA">
                        </div>

                        <!-- Details -->
                        <div>
                            <label class="block mb-2 text-sm font-medium dark:text-white">Bedrooms</label>
                            <input type="number"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="4">
                        </div>
                        <div>
                            <label class="block mb-2 text-sm font-medium dark:text-white">Bathrooms</label>
                            <input type="number"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="3">
                        </div>
                        <div>
                            <label class="block mb-2 text-sm font-medium dark:text-white">Total Area (sqft)</label>
                            <input type="number"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="3200">
                        </div>
                        <div>
                            <label class="block mb-2 text-sm font-medium dark:text-white">Year Built</label>
                            <input type="number"
                                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm border dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="2018">
                        </div>

                        <!-- Description -->
                        <div class="sm:col-span-2">
                            <label for="description"
                                class="block mb-2 text-sm font-medium dark:text-white">Description</label>
                            <textarea id="description" rows="4"
                                class="py-3 px-4 block w-full border-gray-200 border rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-900 dark:border-gray-700 dark:text-gray-400"
                                placeholder="Describe the property..."></textarea>
                        </div>

                        <!-- Image Upload Area -->
                        <div class="sm:col-span-2">
                            <label class="block mb-2 text-sm font-medium dark:text-white">Upload Photos</label>
                            <div
                                class="flex justify-center items-center w-full h-32 px-4 transition bg-white border-2 border-gray-300 border-dashed rounded-md appearance-none cursor-pointer hover:border-gray-400 focus:outline-none dark:bg-slate-900 dark:border-gray-700">
                                <span class="flex items-center space-x-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-500" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                    </svg>
                                    <span class="font-medium text-gray-600 dark:text-gray-400">Drop files to Attach, or
                                        <span class="text-blue-600 underline">browse</span></span>
                                </span>
                                <input type="file" name="file_upload" class="hidden" multiple>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-end gap-x-2">
                        <button type="button"
                            class="py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 dark:bg-slate-900 dark:border-gray-700 dark:text-white dark:hover:bg-gray-800">
                            Save as Draft
                        </button>
                        <button type="button"
                            class="py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700">
                            Publish Listing
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</body>

</html>
